interface:
  display_name: "Draw YACS Circuits"
  short_description: "Create clean, topology-safe YACS schematics"
  default_prompt: "Use $draw-yacs-circuits and the YACS MCP tools to create or refine a clean circuit schematic."
  icon_small: "./assets/yacs-icon.png"
  icon_large: "./assets/yacs-icon.png"
  brand_color: "#2563EB"

dependencies:
  tools:
    - type: "mcp"
      value: "yacs"
      description: "Local tools provided by the installed YACS Desktop app"
